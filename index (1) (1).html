<style>
:root{--blue:#3478f6;--green:#16a34a;--red:#e5484d;--violet:#7c5cff;--ink:#1d2a44;--mute:#64748b;--glass:rgba(255,255,255,.56);--edge:rgba(255,255,255,.8);--shadow:0 12px 40px rgba(70,100,160,.16)}

body{font-family:Inter,'Noto Sans Myanmar','Padauk',system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(160deg,#e9f2ff 0%,#d9e8fb 50%,#eaf3ff 100%);background-attachment:fixed;overflow-x:hidden}

@keyframes sh{to{background-position:-200% 0}}
.state{grid-column:1/-1;border-radius:28px;padding:38px 20px;text-align:center}
.state .big{width:60px;height:60px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;background:rgba(52,120,246,.12);color:var(--blue)}
.state .big .ic{width:30px;height:30px}
.state.v .big{background:rgba(124,92,255,.15);color:var(--violet)}.state.e .big{background:rgba(229,72,77,.14);color:var(--red)}
.state h3{font-size:18px}.state p{margin:8px auto 16px;max-width:460px;color:var(--mute);font-size:14px;line-height:1.55}
.ov{position:fixed;inset:0;background:rgba(30,45,80,.35);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex}
.modal{width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:32px;padding:24px;background:rgba(255,255,255,.82)}
.modal .info{grid-template-columns:1fr;margin:6px 0 18px;gap:12px}
.modal h3{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:19px;margin-bottom:16px}
footer{margin-top:26px;border-radius:28px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--mute)}
footer b{display:block;color:var(--ink);font-size:14px}
.links{display:flex;gap:10px}
.links a{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--blue);background:rgba(255,255,255,.75);border:1px solid var(--edge);transition:transform .2s}
.links a:hover{transform:translateY(-3px)}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding:22px;gap:20px;border-radius:30px}.hero h2{font-size:26px}}
@media(max-width:640px){.grid{grid-template-columns:1fr}.ticks span:nth-child(even){display:none}.bar .sp{display:none}.dp{flex:1 1 100%;order:5}}
@media(max-width:400px){.wrap{padding:12px 10px 20px}header{padding:10px 12px}.brand h1{font-size:16px}.brand p{display:none}.hero{padding:16px}.hero h2{font-size:23px}.veh{padding:14px;border-radius:22px}.tl{height:38px}.info{grid-template-columns:1fr}.btn span.t{display:none}.card{padding:14px}.carbox{width:50px;height:50px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const API_KEY=''; // optional Google Sheets API key
const SHEET_ID='1s8Ju_xWm-7evxUMckDH2F-EiARr2_tzNC1b71hTljYw';
const TAB='ခရီးစဉ်တောင်းခံမှုမှတ်တမ်း';
const I={
car:'<path d="M4 16v-4l1.7-4.3A2 2 0 0 1 7.6 6h8.8a2 2 0 0 1 1.9 1.7L20 12v4"/><rect x="3" y="12" width="18" height="6" rx="2"/><path d="M6.5 18v2M17.5 18v2M7 15h.01M17 15h.01"/>',
refresh:'<path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
building:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2M10 21v-4h4v4"/>',
pin:'<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
purpose:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/>',
person:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M5 19l1.4-1.4M17.6 6.4 19 5"/>',
moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
alert:'<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.5"/>',
check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
x:'<path d="m7 7 10 10M17 7 7 17"/>',
close:'<path d="M6 6l12 12M18 6 6 18"/>',
telegram:'<path d="M21 4 3 11l5.5 2L18 7l-7 7.5V19l3-3 4 3L21 4z"/>',
phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
mail:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/>',
chevL:'<path d="m15 6-6 6 6 6"/>',chevR:'<path d="m9 6 6 6-6 6"/>'};
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const fromKey=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const fmtT=m=>{const h=Math.floor(m/60)%24;return`${h<12?'AM':'PM'} ${h%12||12}:${p2(m%60)}`};
const fmtD=k=>fromKey(k).toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const timeStr=t=>t.e===t.s?fmtT(t.s):`${fmtT(t.s)} – ${fmtT(t.e)}`;

let trips=[],sel=key(new Date()),loaded=false,err=false,view=[];
const T0=360,T1=1080;

/* ---------- data ---------- */
function cell(c){
  if(!c||c.v==null)return'';
  const v=c.v;
  if(Array.isArray(v))return p2(v[0])+':'+p2(v[1]);
  if(typeof v==='string'&&/^Date\(/.test(v)){
    const [y,mo,d,h=0,mi=0]=v.match(/\d+/g).map(Number);
    if(y<1950)return p2(h)+':'+p2(mi);
    return y+'-'+p2(mo+1)+'-'+p2(d)+(h||mi?' '+p2(h)+':'+p2(mi):'');
  }
  return v;
}
async function fetchTable(){
  if(API_KEY){
    const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(TAB)}?key=${API_KEY}`);
    if(!r.ok)throw Error('API '+r.status);
    return (await r.json()).values||[];
  }
  const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(TAB)}`);
  if(!r.ok)throw Error('HTTP '+r.status);
  const t=await r.text();
  const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
  if(j.status==='error')throw Error('Sheet error');
  return [j.table.cols.map(c=>c.label||''),...j.table.rows.map(r=>(r.c||[]).map(cell))];
}
const F={
  name:['တောင်းခံသူအမည်','အမည်','name'],dept:['ဌာန','department'],date:['ခရီးသွားမည့်ရက်','ရက်စွဲ','date'],
  start:['စတင်ချိန်','start_time','start time'],end:['ပြန်ရောက်ချိန်','end_time','end time'],dest:['ခရီးဦးတည်ရာ','destination'],
  purpose:['ရည်ရွယ်ချက်','purpose'],male:['အမျိုးသားဦးရေ','male'],female:['အမျိုးသမီးဦးရေ','female'],status:['အခြေအနေ','status']};
function mapCols(h){
  h=h.map(x=>String(x??'').trim().toLowerCase());const idx={},used=new Set();
  const hit=(x,a)=>x===a||(/[a-z]/.test(a)?new RegExp('(^|[^a-z])'+a).test(x):x.includes(a));
  for(const k in F){const i=h.findIndex((x,n)=>!used.has(n)&&F[k].some(a=>x===a));if(i>=0){idx[k]=i;used.add(i)}}
  for(const k in F){if(k in idx)continue;const i=h.findIndex((x,n)=>!used.has(n)&&F[k].some(a=>hit(x,a)));if(i>=0){idx[k]=i;used.add(i)}}
  return idx;
}
function parseDate(s){
  s=String(s).trim();let m;
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  if(m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/))return m[3]+'-'+p2(m[2])+'-'+p2(m[1]);
  return null;
}
function parseTime(s){
  if(typeof s==='number')return Math.round((s%1)*1440);
  s=String(s).trim();if(!s)return null;
  const m=s.match(/(\d{1,2})[:.](\d{2})(?::\d{2})?\s*([ap]m)?/i);if(!m)return null;
  let h=+m[1];const mi=+m[2],ap=(m[3]||'').toLowerCase();
  if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;
  return h*60+mi;
}
function statusOf(s){
  s=String(s).toLowerCase();
  if(/cancel|ပယ်|မသွား/.test(s))return'cancelled';
  if(/approv|အတည်ပြု|ခွင့်ပြု|ok|yes/.test(s))return'approved';
  return null;
}
function parse(rows){
  if(!rows.length)return[];
  let idx=mapCols(rows[0]),body=rows.slice(1);
  if(!('date' in idx)||!('status' in idx)){ // header row may sit in first data row
    const alt=mapCols(rows[1]||[]);if('date' in alt&&'status' in alt){idx=alt;body=rows.slice(2)}
  }
  const g=(r,k)=>k in idx?r[idx[k]]??'':'';
  const out=[];
  for(const r of body){
    const st=statusOf(g(r,'status')),date=parseDate(g(r,'date'));
    if(!st||!date)continue;
    const s=parseTime(g(r,'start')),e0=parseTime(g(r,'end'));
    if(s==null)continue;
    const e=e0==null||e0<s?s:e0;
    out.push({name:g(r,'name')||'—',dept:g(r,'dept')||'—',date,s,e,dest:g(r,'dest')||'—',purpose:g(r,'purpose')||'—',
      male:parseInt(g(r,'male'))||0,female:parseInt(g(r,'female'))||0,st});
  }
  return out;
}
async function load(){
  const b=$('#rf');b.classList.add('spin');
  try{trips=parse(await fetchTable());err=false;}catch(e){console.error(e);err=true}
  loaded=true;b.classList.remove('spin');render();
}

/* ---------- hero ---------- */
const isSun=()=>fromKey(sel).getDay()===0;
const approvedOn=d=>trips.filter(t=>t.date===d&&t.st==='approved').sort((a,b)=>a.s-b.s);
function merge(list){
  const out=[];
  for(const t of list){const l=out[out.length-1];
    if(l&&t.s<=l.e&&!(l.e===l.s&&t.s>l.e)){l.e=Math.max(l.e,t.e)}else out.push({s:t.s,e:t.e})}
  return out;
}
function drawHero(){
  const today=key(new Date()),isToday=sel===today,n=nowMin(),sun=isSun();
  const approved=sun?[]:approvedOn(sel);
  const tl=$('#tl');tl.className='tl'+(sun?' rest':'');
  const pc=m=>Math.max(0,Math.min(100,(m-T0)/(T1-T0)*100));
  let h='';
  for(const sg of merge(approved)){
    if(sg.e<T0||sg.s>T1)continue;
    if(sg.e===sg.s)h+=`<div class="seg pt" style="left:${pc(sg.s)}%"></div>`;
    else h+=`<div class="seg" style="left:${pc(sg.s)}%;width:${pc(sg.e)-pc(sg.s)}%"></div>`;
  }
  if(isToday&&!sun&&n>=T0&&n<=T1)h+=`<div class="now" style="left:${pc(n)}%"><b>${fmtT(n)}</b></div>`;
  tl.innerHTML=h;
  let cls,txt,dot;
  if(sun){cls='v';txt="Driver's day off";dot='v'}
  else if(!isToday){cls='n';txt='Viewing schedule';dot=''}
  else{
    const busy=approved.some(t=>t.e>t.s?(n>=t.s&&n<t.e):n===t.s);
    cls=busy?'r':'g';txt=busy?'Car is busy now':'Car is available now';dot=busy?'r':'g';
  }
  const b=$('#badge');if(b.textContent!==txt)b.textContent=txt;b.className='badge '+cls;
  $('#dot').className='dot '+dot;
  $('#clock').textContent=isToday&&!sun?'Now '+fmtT(n):'';
}

/* ---------- list ---------- */
const tile=(i,l,v)=>`<div class="it"><span class="tile">${ic(i)}</span><div><small>${l}</small>${esc(v)}</div></div>`;
const infoHTML=t=>tile('calendar','Date',fmtD(t.date))+tile('clock','Time',timeStr(t))+tile('building','Department',t.dept)+
  tile('users','Travelers',`Male ${t.male} · Female ${t.female}`)+tile('pin','Destination',t.dest)+tile('purpose','Purpose',t.purpose);
const badge=t=>t.st==='approved'?`<span class="sb a">${ic('check')}Approved</span>`:`<span class="sb c">${ic('x')}Cancelled</span>`;
const overlap=(a,b)=>(a.s<b.e&&b.s<a.e)||(a.s===b.s&&a.e===b.e);
function drawList(){
  const L=$('#list');$('#dh').textContent=fmtD(sel);
  if(!loaded){L.innerHTML='<div class="sk"></div>'.repeat(4);view=[];return}
  if(err){view=[];L.innerHTML=`<div class="state glass e"><div class="big">${ic('alert')}</div><h3>Couldn't read the sheet</h3>
    <p>Please check that the Google Sheet is shared as "Anyone with the link → Viewer", that the tab name is correct, and that you're online.</p>
    <button class="btn on" id="retry">${ic('refresh')}Retry</button></div>`;$('#retry').onclick=load;return}
  if(isSun()){view=[];L.innerHTML=`<div class="state glass v"><div class="big">${ic('moon')}</div><h3>Sunday — Driver's day off</h3><p>The office car can't be requested on Sundays.</p></div>`;return}
  view=trips.filter(t=>t.date===sel).sort((a,b)=>a.s-b.s);
  if(!view.length){L.innerHTML=`<div class="state glass"><div class="big">${ic('search')}</div><h3>No requests on this day</h3><p>${fmtD(sel)}</p></div>`;return}
  const ap=view.filter(t=>t.st==='approved');
  L.innerHTML=view.map((t,i)=>{
    const ov=t.st==='approved'&&ap.some(o=>o!==t&&overlap(t,o));
    return`<article class="card glass" tabindex="0" role="button" data-i="${i}" aria-label="Details for ${esc(t.name)}">
      <div class="ch"><div class="who">${ic('person')}<span>${esc(t.name)}</span></div>${badge(t)}</div>
      <div class="info">${infoHTML(t)}</div>${ov?`<div class="warn">${ic('alert')}Overlaps with another request</div>`:''}</article>`}).join('');
}
function drawBar(){
  const today=key(new Date()),tm=new Date();tm.setDate(tm.getDate()+1);
  $('#today').classList.toggle('on',sel===today);$('#tmrw').classList.toggle('on',sel===key(tm));
  $('#date').value=sel;
}
function render(){drawBar();drawHero();drawList()}

/* ---------- modal ---------- */
function openM(i){
  const t=view[i];if(!t)return;
  $('#modal').innerHTML=`<h3 id="mt"><span class="who">${ic('person')}<span>${esc(t.name)}</span></span>${badge(t)}</h3>
    <div class="info">${infoHTML(t)}</div><button class="btn on" id="mc">${ic('close')}Close</button>`;
  $('#ov').classList.add('show');$('#mc').focus();$('#mc').onclick=closeM;
}
const closeM=()=>$('#ov').classList.remove('show');

/* ---------- init ---------- */
$('#logo').innerHTML=ic('car');$('#carbox').insertAdjacentHTML('afterbegin',ic('car'));
$('#rf').innerHTML=ic('refresh')+'<span class="t">Refresh</span>';
$('#prev').innerHTML=ic('chevL')+'<span class="t">Previous</span>';$('#next').innerHTML='<span class="t">Next</span>'+ic('chevR');
$('#sunI').innerHTML=ic('sun')+'6:00';$('#moonI').innerHTML='18:00'+ic('moon');$('#calI').innerHTML=ic('calendar');
$('#lt').innerHTML=ic('telegram');$('#lv').innerHTML=ic('phone');$('#lm').innerHTML=ic('mail');
$('#ticks').innerHTML=Array.from({length:13},(_,k)=>`<span style="left:${k/12*100}%">${(6+k)%12||12}</span>`).join('');
$('#rf').onclick=load;
$('#prev').onclick=()=>{const d=fromKey(sel);d.setDate(d.getDate()-1);sel=key(d);render()};
$('#next').onclick=()=>{const d=fromKey(sel);d.setDate(d.getDate()+1);sel=key(d);render()};
$('#today').onclick=()=>{sel=key(new Date());render()};
$('#tmrw').onclick=()=>{const d=new Date();d.setDate(d.getDate()+1);sel=key(d);render()};
$('#date').onchange=e=>{if(e.target.value){sel=e.target.value;render()}};
$('#list').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openM(+c.dataset.i)});
$('#list').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const c=e.target.closest('.card');if(c){e.preventDefault();openM(+c.dataset.i)}}});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
render();load();
setInterval(load,60000);
setInterval(drawHero,15000);
</script>
</body>
</html>
